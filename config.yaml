# vaillant-rag configuration.
# Every key can be overridden by an environment variable with the same
# name in UPPER_CASE (e.g. CHUNK_SIZE_CHARS=800). Secrets such as
# LLM_API_KEY must only be set via environment variables / .env.

# --- Paths ---
docs_dir: data/docs          # source documents (.pdf, .txt, .md, .rst, .html)
index_dir: data/index        # generated index (gitignored)
system_prompt_path: prompts/system_prompt.txt
log_dir: logs
log_file: vaillant_rag.log
log_level: INFO

# --- LLM: any OpenAI-compatible endpoint ---
# Ollama:    http://localhost:11434/v1
# LM Studio: http://localhost:1234/v1
# vLLM:      http://localhost:8000/v1
# OpenAI:    https://api.openai.com/v1   (set LLM_API_KEY in .env)
llm_base_url: http://localhost:11434/v1
llm_model: phi4-mini
llm_temperature: 0.2
llm_max_tokens: 1024
llm_timeout_seconds: 180

# --- Embeddings ---
embedding_model: intfloat/multilingual-e5-small
embedding_batch_size: 64

# --- Chunking ---
chunk_size_chars: 1000
chunk_overlap_chars: 150

# --- Retrieval ---
top_k: 20                    # candidates retrieved before final selection
top_n_contexts: 5            # contexts sent to the LLM
use_hybrid_search: true      # dense + BM25 with reciprocal rank fusion
vector_backend: auto         # auto | numpy | faiss (faiss needs `pip install vaillant-rag[faiss]`)
faiss_min_chunks: 50000      # auto mode: switch to FAISS above this many chunks
use_reranker: false          # cross-encoder re-ranking of retrieved candidates
reranker_model: cross-encoder/ms-marco-MiniLM-L6-v2  # multilingual: BAAI/bge-reranker-base

# --- Document extraction ---
ocr_images: false            # OCR images in PDFs (requires `pip install vaillant-rag[ocr]` + Tesseract)
max_analysis_chars: 20000    # cap on text sent to the LLM by `analyze`
