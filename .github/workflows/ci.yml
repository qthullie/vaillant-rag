name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # sentence-transformers (and its torch dependency) is intentionally
      # NOT installed: tests use a fake embedder and run offline.
      - name: Install test dependencies
        run: |
          pip install numpy requests python-dotenv PyYAML PyMuPDF rank-bm25 pytest \
            fastapi httpx faiss-cpu
      - name: Run tests
        run: pytest -v
