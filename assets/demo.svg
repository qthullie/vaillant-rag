<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14">
  <!-- vaillant-rag animated terminal demo — original artwork, MIT licensed with the project -->
  <style>
    .bg { fill: #10141c; }
    .bar { fill: #1c2230; }
    .dim { fill: #6b7689; }
    .txt { fill: #d7dee9; }
    .accent { fill: #e8871e; }
    .ok { fill: #3f9e6e; }
    .line { opacity: 0; animation: appear 0.01s linear forwards; }
    @keyframes appear { to { opacity: 1; } }
    .l1  { animation-delay: 0.4s; }
    .l2  { animation-delay: 1.0s; }
    .l3  { animation-delay: 1.6s; }
    .l4  { animation-delay: 4.3s; }
    .l5  { animation-delay: 4.5s; }
    .l6  { animation-delay: 5.1s; }
    .a1  { animation-delay: 5.7s; }
    .a2  { animation-delay: 6.5s; }
    .a3  { animation-delay: 7.3s; }
    .a4  { animation-delay: 8.1s; }
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    /* the logo pigeon carries the answer across while it loads */
    .flight { opacity: 0; animation: fly 2.0s linear forwards; animation-delay: 2.2s; }
    @keyframes fly { 0% { transform: translateX(-70px); opacity: 1; }
                     99.9% { transform: translateX(790px); opacity: 1; }
                     100% { transform: translateX(790px); opacity: 0; } }
    .wingA { animation: flapA 0.3s steps(1) infinite; }
    .wingB { animation: flapB 0.3s steps(1) infinite; }
    @keyframes flapA { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes flapB { 0%, 49.9% { opacity: 0; } 50%, 100% { opacity: 1; } }
  </style>

  <defs>
    <!-- pixel pigeon from assets/logo.svg, wing animated for flight -->
    <g id="pigeon" shape-rendering="crispEdges">
      <!-- tail -->
      <rect x="0" y="6" width="3" height="1" fill="#56637d"/>
      <rect x="0" y="7" width="4" height="1" fill="#56637d"/>
      <rect x="1" y="8" width="3" height="1" fill="#56637d"/>
      <!-- head -->
      <rect x="9" y="2" width="3" height="1" fill="#8e9aaf"/>
      <rect x="8" y="3" width="5" height="1" fill="#8e9aaf"/>
      <rect x="11" y="3" width="1" height="1" fill="#1b1f27"/>
      <rect x="8" y="4" width="5" height="1" fill="#8e9aaf"/>
      <!-- beak -->
      <rect x="13" y="4" width="2" height="1" fill="#e8871e"/>
      <!-- neck with green sheen -->
      <rect x="8" y="5" width="4" height="1" fill="#3f9e6e"/>
      <rect x="8" y="6" width="4" height="1" fill="#3f9e6e"/>
      <!-- body -->
      <rect x="3" y="6" width="5" height="1" fill="#8e9aaf"/>
      <rect x="4" y="7" width="8" height="1" fill="#8e9aaf"/>
      <rect x="4" y="8" width="4" height="1" fill="#8e9aaf"/>
      <!-- belly -->
      <rect x="8" y="8" width="4" height="1" fill="#e9eef5"/>
      <rect x="5" y="9" width="6" height="1" fill="#e9eef5"/>
      <rect x="6" y="10" width="4" height="1" fill="#8e9aaf"/>
      <!-- message tube on the leg (the retrieval payload) -->
      <rect x="9" y="11" width="2" height="1" fill="#c0392b"/>
      <!-- feet tucked for flight -->
      <rect x="7" y="11" width="1" height="1" fill="#e8871e"/>
      <rect x="9" y="12" width="1" height="1" fill="#e8871e"/>
      <!-- wing, two flap positions -->
      <g class="wingA">
        <rect x="5" y="6" width="3" height="1" fill="#56637d"/>
        <rect x="4" y="7" width="4" height="1" fill="#56637d"/>
      </g>
      <g class="wingB">
        <rect x="5" y="4" width="2" height="1" fill="#56637d"/>
        <rect x="4" y="5" width="3" height="1" fill="#56637d"/>
      </g>
    </g>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="380" rx="10"/>
  <rect class="bar" x="0" y="0" width="760" height="34" rx="10"/>
  <circle cx="22" cy="17" r="6" fill="#e0604f"/>
  <circle cx="44" cy="17" r="6" fill="#e0b04f"/>
  <circle cx="66" cy="17" r="6" fill="#5fb35f"/>
  <text x="380" y="22" text-anchor="middle" class="dim" font-size="12">vaillant-rag — qa</text>

  <text class="line l1 txt" x="24" y="64"><tspan class="accent">$</tspan> vaillant-rag qa</text>
  <text class="line l2 dim" x="24" y="90">Loaded 342 chunks. Type 'quit' to exit.</text>

  <text class="line l3 txt" x="24" y="128">Your question: <tspan class="accent">what was the last message sent from Fort Vaux?</tspan></text>

  <!-- loading: the messenger is on its way -->
  <g class="flight">
    <use href="#pigeon" transform="translate(0,150) scale(2.6)"/>
  </g>

  <text class="line l4 ok" x="24" y="166">=== Answer ===</text>

  <text class="line l5 txt" x="24" y="200">On 4 June 1916, Commandant Raynal's final dispatch reported that</text>
  <text class="line l6 txt" x="24" y="222">the fort was holding under gas and heavy shelling — carried by</text>
  <text class="line a1 txt" x="24" y="244">his last pigeon, <tspan class="accent">Vaillant</tspan>, who delivered it despite injuries</text>
  <text class="line a2 txt" x="24" y="266">and was later awarded a citation. <tspan class="dim">[context: fort_vaux.pdf#chunk-12]</tspan></text>

  <text class="line a3 dim" x="24" y="300">(3.8s — streamed, hybrid search: dense + BM25, RRF)</text>

  <text class="line a4 txt" x="24" y="338">Your question: <tspan class="cursor accent">▌</tspan></text>
</svg>
